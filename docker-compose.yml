# Local full stack: MongoDB, Redis, API, worker, React (nginx).
# Copy server/.env.example → server/.env and set secrets before: docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/short_url
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLIENT_ORIGIN: http://localhost:8080,http://localhost:5173
    command: ["npm", "run", "start"]
    depends_on:
      - mongo
      - redis

  worker:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/short_url
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ["npm", "run", "worker"]
    depends_on:
      - mongo
      - redis
      - api

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE: /api/v1
        VITE_API_ORIGIN: http://localhost:3000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo_data:
